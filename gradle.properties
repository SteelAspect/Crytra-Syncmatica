org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft 1.21.11 only (single-version build; upstream's multi-version preprocessor was dropped)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
fabric_api_version=0.141.6+1.21.11

# Client-only dependencies (Modrinth Maven). Pinned to the pair upstream verified together:
# litematica 0.26.11 depends on malilib [0.27.14, 0.28.0); malilib >= 0.27.17 breaks litematica < 0.26.13.
litematica_version=0.26.11
malilib_version=0.27.16
# Dev-runtime only: litematica/malilib bundle this via jar-in-jar, loom does not expand it
conditional_mixin_version=0.6.4

fabric_permissions_api_version=0.6.1

mod_version=1.0.0
maven_group=com.steelaspect
archives_base_name=cytra-syncmatica

# Modrinth project slug or id (see the modrinth block in build.gradle)
modrinth_project=cytra-syncmatica

plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.10.0'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "FallenBreathReleases"
        url = "https://maven.fallenbreath.me/releases"
        content {
            includeGroup "me.fallenbreath"
        }
    }
}

configurations {
    testImplementation.extendsFrom = []
    testRuntimeOnly.extendsFrom = []
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Client-only at runtime: declared under the client environment in fabric.mod.json.
    // Every class that touches them lives in the client packages and is only loaded on a client.
    modImplementation "maven.modrinth:litematica:${project.litematica_version}"
    modImplementation "maven.modrinth:malilib:${project.malilib_version}"
    modLocalRuntime "me.fallenbreath:conditional-mixin-fabric:${project.conditional_mixin_version}"

    // Cytra Link's public API (net.cytra.link.api) for the Discord bridge. Compile-time only:
    // the bridge classes are registered through the "cytra-link" entrypoint and are only
    // loaded when Cytra Link is installed on the server.
    compileOnly files("libs/cytra-link-0.3.0.jar")

    // Bundled (jar-in-jar); LuckPerms-compatible permission checks with vanilla op-level fallback.
    include(modImplementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))

    testImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    testImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
    it.options.compilerArgs += ['-Xlint:-processing']
}

tasks.named("test") {
    useJUnitPlatform()
    systemProperty "cytra.projectRoot", rootProject.projectDir.absolutePath
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

loom {
    mixin {
        useLegacyMixinAp = false
        defaultRefmapName = "cytra-syncmatica.refmap.json"
    }
    runs {
        client {
            client()
            name = "Minecraft Client"
            runDir = "run/client"
        }
        server {
            server()
            name = "Minecraft Server"
            runDir = "run/server"
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(remapJar) { builtBy remapJar }
        }
    }
}

// Modrinth upload: `./gradlew modrinth` with the MODRINTH_TOKEN environment variable set (a Modrinth token with the
// CREATE_VERSION scope). Changelog text comes from -Pchangelog="..."; add -PmodrinthDryRun to print the upload
// without sending it. Fails if this version number is already on Modrinth.
modrinth {
    projectId = project.modrinth_project
    versionNumber = project.version.toString()
    versionName = "Cytra-Syncmatica ${project.mod_version}"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = project.findProperty('changelog') ?: "Cytra-Syncmatica ${project.mod_version}"
    debugMode = project.hasProperty('modrinthDryRun')
    dependencies {
        required.project 'fabric-api'
        // Client-side only (fabric.mod.json recommends): a server doesn't need them.
        optional.project 'litematica'
        optional.project 'malilib'
        // Same network channels; refuses to load next to either.
        incompatible.project 'syncmatica'
        incompatible.project 'syncmatica-revolution'
    }
}

[project]
name = "cytra-syncmatica-bot"
version = "1.0.0"
description = "Discord bot for Cytra-Syncmatica: shared material lists over the Cytra Link connection"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cytra_syncmatica_bot", "cytra_syncmatica_bot.cogs"]
